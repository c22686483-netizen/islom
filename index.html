
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;tgrg
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .card {
            width: 350px;
            padding: 40px 35px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            animation: chiqish 0.8s ease;
        }

        @keyframes chiqish {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 32px;
            border-radius: 50%;
        }

        h2 {
            color: #222;
            margin-bottom: 8px;
            font-size: 28px;
        }

        p {
            color: #777;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .bottom {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }

        .bottom span {
            color: #667eea;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon">👤</div>

        <h2>Kirish</h2>

        <p>Ma'lumotlaringizni kiriting</p>

        <input type="text" placeholder="Ismingiz">

        <input type="text" placeholder="Familiyangiz">

        <button type="submit">Kirish →</button>

        <div class="bottom">
            Akkauntingiz yo'qmi?
            <span>Ro'yxatdan o'tish</span>
        </div>

    </div>

</body>

</html>
